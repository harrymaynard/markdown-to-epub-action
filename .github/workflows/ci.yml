name: CI

on: [push, workflow_dispatch]

jobs:
  generate-epub:
    name: Create ePub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Create ePub
        uses: harrymaynard/markdown-to-epub-action@feat/v2
        with:
          markdownFiles: |-
            test-data/publication.md
            test-data/chapter-*.md
          title: My Book
          author: John Doe
          publisher: ACME Publishing Inc.
          # cover: test-data/images/cover.jpg
          cover: https://raw.githubusercontent.com/harrymaynard/markdown-to-epub-action/refs/heads/feat/v2/test-data/images/cover.jpg
          version: 3
          lang: en
          tocTitle: My Table of Contents
          hideToC: false
          output: my-book.epub

      - uses: actions/upload-artifact@v4
        with:
          path: my-book.epub
          if-no-files-found: error
          retention-days: 7
